[workspace]
members = [
  "crates/mpb-agent",
  "crates/mpb-assets",
  "crates/mpb-core",
  "crates/mpb-export",
  "crates/mpb-render",
  "crates/mpb-storage",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
