[package]
name = "app-tauri"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minecraft-pack-builder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mpb-assets = { path = "../crates/mpb-assets" }
mpb-agent = { path = "../crates/mpb-agent" }
mpb-core = { path = "../crates/mpb-core" }
mpb-export = { path = "../crates/mpb-export" }
mpb-render = { path = "../crates/mpb-render" }
mpb-storage = { path = "../crates/mpb-storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
