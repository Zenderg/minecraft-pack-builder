pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mpb-minecraft-mod'

def requestedLoaders = (System.getenv('MPB_MOD_LOADERS') ?: 'fabric forge neoforge')
    .split(/\s+/)
    .findAll { !it.isBlank() } as Set

if (requestedLoaders.contains('fabric')) {
    include 'fabric'
}
if (requestedLoaders.contains('forge')) {
    include 'forge'
}
if (requestedLoaders.contains('neoforge')) {
    include 'neoforge'
}
